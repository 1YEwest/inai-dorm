<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявка на комнату в общежитии</title>
<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: #fff;
  color: #1d1d1f;
}
header {
  border-bottom: 1px solid #d2d2d7;
}
.header-inner {
  max-width: 680px;
  margin: 0 auto;
  padding: 14px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-size: 17px;
  font-weight: 600;
}
.header-link {
  font-size: 12px;
  color: #6e6e73;
  text-decoration: none;
}
main {
  max-width: 680px;
  margin: 0 auto;
  padding: 48px 22px 60px;
}
h1 {
  font-size: 32px;
  font-weight: 600;
  margin: 0 0 8px;
}
.subtitle {
  font-size: 17px;
  color: #6e6e73;
  margin: 0 0 36px;
}
label {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
}
input {
  width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
  font-size: 16px;
  border: 1px solid #d2d2d7;
  border-radius: 8px;
  margin-bottom: 20px;
  font-family: inherit;
}
input:focus {
  outline: none;
  border-color: #0071e3;
  box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.25);
}
button {
  background: #0071e3;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 12px 24px;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
}
button:hover {
  background: #0066cc;
}
#result {
  display: none;
  margin-top: 32px;
  padding: 20px 22px;
  border: 1px solid #d2d2d7;
  border-radius: 12px;
  font-size: 15px;
  line-height: 1.5;
}
#result h2 {
  font-size: 19px;
  font-weight: 600;
  margin: 0 0 8px;
}
#result.ok h2 {
  color: #248a3d;
}
#result.fail h2 {
  color: #d70015;
}
#result ul {
  margin: 8px 0 0;
  padding-left: 20px;
}
.hint {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid #d2d2d7;
  font-size: 12px;
  color: #6e6e73;
  line-height: 1.6;
}
footer {
  border-top: 1px solid #d2d2d7;
  padding: 18px 22px;
  text-align: center;
  font-size: 12px;
  color: #6e6e73;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Общежитие INAI</div>
    <a class="header-link" href="#">Помощь</a>
  </div>
</header>

<main>
  <h1>Заявка на комнату</h1>
  <p class="subtitle">Заполните форму, и система проверит возможность заселения.</p>

  <form id="form">
    <label for="student">ID студента</label>
    <input type="number" id="student" required>

    <label for="building">Номер корпуса</label>
    <input type="number" id="building" required>

    <label for="room">Номер комнаты</label>
    <input type="number" id="room" required>

    <button type="submit">Проверить</button>
  </form>

  <div id="result"></div>

  <p class="hint">
    Студенты: 1, 2, 3. Корпуса: 1, 2, 3. Комнаты: 101, 102, 103, 201, 202, 203.
  </p>
</main>

<footer>Учебный проект. INAI, 2 курс.</footer>

<script>
const API = 'https://inai-col1.fishrungames.com';
const form = document.getElementById('form');
const result = document.getElementById('result');

form.addEventListener('submit', async function (e) {
  e.preventDefault();

  const studentId = document.getElementById('student').value;
  const buildingId = document.getElementById('building').value;
  const roomId = document.getElementById('room').value;

  result.style.display = 'none';

  try {
    const studentRes = await fetch(API + '/students/' + studentId);
    const buildingRes = await fetch(API + '/buildings/' + buildingId);
    const roomRes = await fetch(API + '/rooms/' + roomId);

    if (!studentRes.ok || !buildingRes.ok || !roomRes.ok) {
      result.style.display = 'block';
      result.className = 'fail';
      result.innerHTML = '<h2>Ошибка</h2><p>Студент, корпус или комната не найдены. Проверьте введённые номера.</p>';
      return;
    }

    const student = await studentRes.json();
    const building = await buildingRes.json();
    const room = await roomRes.json();

    const reasons = [];

    if (student.resident) {
      reasons.push('Студент не является иногородним');
    }
    if (!building.forStudents) {
      reasons.push('Корпус не предназначен для студентов');
    }
    if (!room.available) {
      reasons.push('Комната занята');
    }

    result.style.display = 'block';

    if (reasons.length === 0) {
      result.className = 'ok';
      result.innerHTML = '<h2>Заявка одобрена</h2><p>Студент ' + student.name +
        ' может заселиться в комнату ' + room.room_number +
        ' в корпусе ' + building.building_number + '.</p>';
    } else {
      result.className = 'fail';
      result.innerHTML = '<h2>Отказ в заселении</h2><ul><li>' + reasons.join('</li><li>') + '</li></ul>';
    }
  } catch (err) {
    result.style.display = 'block';
    result.className = 'fail';
    result.innerHTML = '<h2>Ошибка</h2><p>Не удалось связаться с сервером.</p>';
  }
});
</script>

</body>
</html>
